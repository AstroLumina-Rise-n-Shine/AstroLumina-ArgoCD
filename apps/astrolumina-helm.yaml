---
# ApplicationSet generating the three per-env Helm releases
# (astrolumina-helm-dev/staging/production) from one template plus a List
# generator. ArgoCD stamps one Application per `elements` entry and runs
# `helm template` with values.yaml plus the env file (later files win).
# Adding a new env later means adding one list entry, not copying a whole
# document. The stamped Applications keep the exact names used before, so the
# rename is seamless (delete the old standalone Applications first, then
# apply this file -- with manual sync nothing auto-applies in between).
#
# Staging/production do blue/green via the per-service `blueGreen.liveColors`
# entries plus `imageTags.blue/green` in their values file -- a flip is a git
# commit changing one service line, then SYNC. Production upgrades are commits
# changing tags (a rollback is a revert).
#
# Sync is MANUAL on all three (no `automated` block on purpose): press SYNC
# in the UI per change. `prune: true` deletes from the cluster objects
# removed from git. `CreateNamespace: true` creates the namespace if missing.
#
# PREREQUISITES before the first SYNC: the Doppler operator, the Traefik CRDs
# (IngressRoute, Middleware -- shipped with RKE2), the ghcr image-pull secret
# created imperatively, and placeholder secrets enabled or replaced
# (`placeholderSecretsEnabled` in each values file).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: astrolumina-helm
  namespace: argocd
  labels:
    app.kubernetes.io/name: astrolumina-helm
    app.kubernetes.io/part-of: astrolumina-platform
spec:
  generators:
    - list:
        elements:
          - env: dev
            namespace: astrolumina-dev
            valuesFile: values-dev.yaml
          - env: staging
            namespace: astrolumina-staging
            valuesFile: values-staging.yaml
          - env: production
            namespace: astrolumina-prod
            valuesFile: values-production.yaml
  template:
    metadata:
      name: 'astrolumina-helm-{{env}}'
      labels:
        app.kubernetes.io/name: 'astrolumina-helm-{{env}}'
        app.kubernetes.io/part-of: astrolumina-platform
    spec:
      project: default
      source:
        repoURL: https://github.com/AstroLumina-Rise-n-Shine/AstroLumina-Helm.git
        targetRevision: HEAD
        path: charts/astrolumina
        helm:
          # values.yaml first, env file second (later files win on conflict).
          valueFiles:
            - values.yaml
            - '{{valuesFile}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        prune: true
        syncOptions:
          - CreateNamespace=true
