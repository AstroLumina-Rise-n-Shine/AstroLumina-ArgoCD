---
# ApplicationSet generating the three per-env Kustomize Applications
# (astrolumina-kubernetes-dev/staging/production) from one template plus a
# List generator. ArgoCD stamps one Application per `elements` entry, so
# adding a new env later means adding one list entry, not copying a whole
# document. The stamped Applications keep the exact names used before, so the
# rename is seamless (delete the old standalone Applications first, then
# apply this file -- with manual sync nothing auto-applies in between).
#
# Each app: ArgoCD runs `kustomize build` on the env directory (detected
# automatically from its kustomization.yaml) and syncs the result.
# Staging/production carry the blue + green Deployments plus the
# 53-live-services.yaml selectors -- a live flip is a git commit changing
# those selectors, then SYNC. Production image upgrades are commits changing
# tags in git (a rollback is a revert).
#
# Sync is MANUAL on all three (no `automated` block on purpose): press SYNC
# in the UI per change. `prune: true` deletes from the cluster objects
# removed from git. `CreateNamespace: true` creates the namespace if missing
# (the build also contains the Namespace object itself).
#
# PREREQUISITES before the first SYNC: the Doppler operator (it resolves the
# DopplerSecret CRs), the ghcr image-pull secret created imperatively, the
# Traefik CRDs for staging/production (IngressRoute, Middleware -- shipped
# with RKE2), and ARGOCD.md section 0 completed in the Kubernetes repo
# (placeholders out of the live kustomizations, everything pushed) -- ArgoCD
# syncs exactly what is committed, with no selective-apply step.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: astrolumina-kubernetes
  namespace: argocd
  labels:
    app.kubernetes.io/name: astrolumina-kubernetes
    app.kubernetes.io/part-of: astrolumina-platform
spec:
  generators:
    - list:
        elements:
          - env: dev
            path: development
            namespace: astrolumina-dev
          - env: staging
            path: staging
            namespace: astrolumina-staging
          - env: production
            path: production
            namespace: astrolumina-prod
  template:
    metadata:
      name: 'astrolumina-kubernetes-{{env}}'
      labels:
        app.kubernetes.io/name: 'astrolumina-kubernetes-{{env}}'
        app.kubernetes.io/part-of: astrolumina-platform
    spec:
      project: default
      source:
        repoURL: https://github.com/AstroLumina-Rise-n-Shine/AstroLumina-Kubernetes.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        prune: true
        syncOptions:
          - CreateNamespace=true
